<app-navbar></app-navbar>

<main class="about-page">
  <!-- HERO BANNER -->
  <section class="about-hero-section">
    <div class="about-hero-container">
      <img [src]="heroImage" alt="E-Com Shop Team" loading="lazy" class="about-hero-img" />
    </div>
  </section>

  <!-- CONTENT BLOCKS -->
  <div class="about-content-container">
    <!-- OUR STORY -->
    <section class="text-section">
      <h2 class="section-title">OUR STORY</h2>
      <div class="paragraphs">
        <p *ngFor="let p of storyParagraphs">{{ p }}</p>
      </div>
    </section>

    <!-- MISSION & VISION -->
    <section class="text-section">
      <h2 class="section-title">MISSION &amp; VISION</h2>
      <div class="paragraphs">
        <p *ngFor="let p of missionVisionParagraphs">{{ p }}</p>
      </div>
    </section>

    <!-- OUR TEAM LEADERSHIP -->
    <section class="team-section">
      <h2 class="section-title">OUR TEAM LEADERSHIP</h2>
      <div class="team-grid">
        <div class="team-member-card" *ngFor="let member of team">
          <div class="member-avatar-wrapper" [style.border-color]="member.borderColor">
            <img [src]="member.photo" [alt]="member.name" loading="lazy" class="member-avatar" />
          </div>
          <h4 class="member-name">{{ member.name }}</h4>
          <span class="member-role">{{ member.role }}</span>
        </div>
      </div>
    </section>
  </div>
</main>

<app-footer></app-footer>
