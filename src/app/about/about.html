
<img class="hero-img" [src]="heroImage" alt="Team">

<div class="container content">

  <section class="text-block">
    <h2 class="section-title">Our Story</h2>
    <p class="lead-text" *ngFor="let p of storyParagraphs">{{ p }}</p>
  </section>

  <section class="text-block">
    <h2 class="section-title">Mission & Vision</h2>
    <p class="lead-text" *ngFor="let p of missionVisionParagraphs">{{ p }}</p>
  </section>

  <section>
    <h2 class="section-title">Our Team Leadership</h2>
    <div class="team-grid">
      <div class="team-card" *ngFor="let member of team">
        <img class="team-photo" [src]="member.photo" [alt]="member.name">
        <div class="team-name">{{ member.name }}</div>
        <div class="team-role">{{ member.role }}</div>
      </div>
    </div>
  </section>
</div>

<div class="feature-strip">
  <div class="container feature-grid">
    <div class="feature-item" *ngFor="let f of features">
      <div class="feature-icon">{{ f.icon }}</div>
      <div class="feature-label">{{ f.label }}</div>
    </div>
  </div>
</div>
  
<footer>
  <div class="container footer">
    <span>© 2026 E-Com Shop. All rights reserved.</span>
    <span>
       <a href="#">Terms</a> &nbsp;|&nbsp;
       <a href="#">Privacy Policy</a>
     </span>
  </div>
</footer>
