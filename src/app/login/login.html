<!-- ===== NAVBAR ===== -->
<nav class="navbar">
  <div class="nav-brand">
    <div class="nav-logo">
      <span>🛒</span>
    </div>
    <span class="nav-brand-name">E-Com Shop</span>
  </div>
  <button class="btn-register" routerLink="/register">Register</button>
</nav>

<!-- ===== LOGIN PAGE WRAPPER ===== -->
<div class="login-page">
  <div class="login-card">
    <h1 class="login-title">
      WELCOME<br />BACK
    </h1>

    <!-- Alerts -->
    @if (successMessage()) {
      <div class="alert alert-success fade-out-alert">
        ✅ {{ successMessage() }}
      </div>
    }
    @if (errorMessage()) {
      <div class="alert alert-error">
        ❌ {{ errorMessage() }}
      </div>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
      <!-- Username/Email Input -->
      <div class="form-group">
        <div class="input-wrap" [class.input-error]="isInvalid('identifier')">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input
            id="identifier"
            type="text"
            formControlName="identifier"
            placeholder="Username/Email"
          />
        </div>
        @if (isInvalid('identifier')) {
          <span class="error-msg">Username or Email is required.</span>
        }
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <div class="input-wrap" [class.input-error]="isInvalid('password')">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Password"
          />
          <button
            type="button"
            class="eye-btn"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          >
            @if (showPassword()) {
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            }
          </button>
        </div>
        @if (isInvalid('password')) {
          <span class="error-msg">Password is required.</span>
        }
      </div>

      <!-- Remember Me & Forgot Password -->
      <div class="options-row">
        <label class="remember-me">
          <input type="checkbox" formControlName="rememberMe" />
          <span>Remember Me</span>
        </label>
        <a routerLink="/forgot-password" class="forgot-link">Forget Password?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-login" [disabled]="isLoading()">
        @if (isLoading()) { Logging In... } @else { Log In }
      </button>

      <!-- Register Link -->
      <div class="register-footer">
        <span>New user? </span>
        <a routerLink="/register" class="register-link">Register now.</a>
      </div>
    </form>
  </div>
</div>
